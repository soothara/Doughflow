name: DoughFlow static security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check app JavaScript syntax
        run: |
          node --input-type=module --check < app/app.js
          node --check app/config.js
          node --check app/sw.js
      - name: Run security smoke checks
        run: node security-smoke.mjs
