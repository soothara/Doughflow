name: DoughFlow static security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Check app JavaScript syntax
        run: |
          node --input-type=module --check < app/app.js
          node --check app/config.js
          node --check app/sw.js
      - name: Run security smoke checks
        run: node security-smoke.mjs

  upscale-gallery:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU super-resolution dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pillow
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          cd /tmp/Real-ESRGAN
          python -m pip install -r requirements.txt
          python setup.py develop
      - name: AI-upscale all ten photos
        run: |
          mkdir -p /tmp/doughflow-upscaled
          python /tmp/Real-ESRGAN/inference_realesrgan.py \
            -n RealESRGAN_x4plus \
            -i app/assets/doughflow-gallery \
            -o /tmp/doughflow-upscaled \
            --outscale 4 \
            --tile 256 \
            --tile_pad 10
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageEnhance
          source = Path("/tmp/doughflow-upscaled")
          target = Path("app/assets/doughflow-gallery")
          names = [
              "01-baker-tandoor.webp", "02-leposhka-closeup.webp",
              "03-bishkek-context.webp", "04-bread-delivery-owner.webp",
              "05-bread-delivery-worker.webp", "06-van-bread-stock.webp",
              "07-bakery-team.webp", "08-bakery-team-selfie.webp",
              "09-team-social.webp", "10-oven-production.webp",
          ]
          for name in names:
              candidates = list(source.glob(Path(name).stem + ".*"))
              if not candidates:
                  raise SystemExit(f"Missing AI-upscaled output: {name}")
              with Image.open(candidates[0]) as image:
                  image = image.convert("RGB").resize((1280, 720), Image.Resampling.LANCZOS)
                  image = ImageEnhance.Contrast(image).enhance(1.025)
                  image = image.filter(ImageFilter.UnsharpMask(radius=1.15, percent=115, threshold=3))
                  image.save(target / name, "WEBP", quality=91, method=6)
              print(f"{name}: {(target / name).stat().st_size:,} bytes")
          PY
      - name: Commit improved gallery assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/doughflow-gallery/*.webp
          if git diff --cached --quiet; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git commit -m "AI-upscale DoughFlow gallery images to 1280x720"
          git push origin HEAD:main
