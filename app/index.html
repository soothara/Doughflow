<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="DoughFlow production and inventory management" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />
  <title>DoughFlow</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0b1220;--accent:#2563eb;--ok:#15803d;--warn:#b45309;--danger:#b91c1c;--radius:18px}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}button{cursor:pointer}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.96);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;backdrop-filter:blur(10px)}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand-mark{width:38px;height:38px;border-radius:12px;background:#fff;color:#0b1220;display:grid;place-items:center;font-weight:900}
    .top-actions{display:flex;gap:8px;align-items:center}.language-select{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700}.language-select option{color:#0f172a;background:#fff}.top-actions button{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;padding:9px 12px;border-radius:12px}
    .layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 62px)}
    .sidebar{background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}.nav{display:grid;gap:8px}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:13px;color:#475569}.nav button.active{background:#eef4ff;color:#1d4ed8;font-weight:700}.role-pill{margin:8px 0 18px;padding:8px 10px;border-radius:12px;background:#f1f5f9;color:#475569;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    main{padding:24px;min-width:0}.page{max-width:1200px;margin:0 auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h1{margin:0 0 6px;font-size:30px}.page-head p{margin:0;color:var(--muted)}
    .grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 3px 12px rgba(15,23,42,.04)}.card h2,.card h3{margin:0 0 12px}.kpi-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.kpi{font-size:30px;font-weight:800;margin-top:6px}.small{font-size:12px;color:var(--muted)}
    .btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700}.btn.primary{background:var(--accent);color:#fff}.btn.secondary{background:#eef2f7;color:#0f172a}.btn.success{background:#dcfce7;color:#166534}.btn.danger{background:#fee2e2;color:#991b1b}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
    .field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:700}.field input,.field select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff}.field-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .seg{display:flex;flex-wrap:wrap;gap:8px}.seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.seg button.active{background:#e8f0ff;border-color:#b6ccff;color:#1d4ed8;font-weight:800}
    table{width:100%;border-collapse:collapse}.table-wrap{overflow:auto}.table-wrap table{min-width:640px}.table-wrap th,.table-wrap td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}.table-wrap th{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
    .status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.status.ok{background:#dcfce7;color:#166534}.status.warn{background:#fef3c7;color:#92400e}.status.danger{background:#fee2e2;color:#991b1b}.status.neutral{background:#f1f5f9;color:#475569}
    .alert{padding:12px 14px;border-radius:14px;margin-bottom:12px}.alert.info{background:#eff6ff;color:#1e40af}.alert.warn{background:#fffbeb;color:#92400e}.alert.error{background:#fef2f2;color:#991b1b}
    .notice{padding:14px;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b;background:#fafafa}.empty{text-align:center;padding:36px;color:#64748b}
    .batch-row{display:grid;grid-template-columns:70px 100px 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.batch-row:last-child{border-bottom:0}.batch-index{font-weight:800}.batch-kind{font-size:12px;color:#64748b}.batch-row input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 10px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal-backdrop.show{display:flex}.modal{width:min(720px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.modal-head button{border:0;background:#f1f5f9;width:38px;height:38px;border-radius:12px}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#0b1220,#162542)}.login-card{width:min(430px,100%);background:#fff;border-radius:26px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.login-card h1{margin:0 0 8px}.login-card p{color:var(--muted);margin:0 0 18px}.logo-large{width:56px;height:56px;border-radius:18px;background:#0b1220;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;margin-bottom:16px}
    .mobile-only{display:none}
    @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;padding:8px 10px;border-right:0;border-top:1px solid var(--line);z-index:25}.nav{grid-template-columns:repeat(4,1fr);gap:4px}.nav button{font-size:11px;text-align:center;padding:9px 4px}.role-pill{display:none}main{padding-bottom:86px}.mobile-only{display:block}}
    @media(max-width:640px){main{padding:16px}.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.page-head{flex-direction:column}.page-head h1{font-size:25px}.field-row{grid-template-columns:1fr}.table-wrap table{min-width:560px}.batch-row{grid-template-columns:52px 80px 1fr}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<script src="config.js"></script><script type="module" src="app.js"></script>
</body>
</html>
